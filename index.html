<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Archive</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12171A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F2; --ink:#12171A; --ink-60:#5A6468; --tile:#9AA4A2;
  --rule:#C9CDC9; --red:#E4002B; --blue:#0072CE; --alu:#B4BAB8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;font-variation-settings:"wdth" 100;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 72px}

.masthead{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-bottom:14px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap;
}
.mark{
  font-variation-settings:"wdth" 118,"wght" 800;
  font-size:clamp(18px,2.4vw,26px);letter-spacing:-.01em;text-transform:uppercase;
}
.mark em{font-style:normal;color:var(--red)}
.mast-right{display:flex;align-items:center;gap:16px}
.count{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-60);
  letter-spacing:.06em;text-transform:uppercase;
}
.toollink{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;color:var(--ink-60);
  border-bottom:1.5px solid var(--rule);padding-bottom:3px;white-space:nowrap;
  transition:color .15s ease,border-color .15s ease;
}
.toollink:hover{color:var(--ink);border-color:var(--ink)}
.submitlink{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;color:var(--ink);
  border:1.5px solid var(--ink);padding:6px 12px;white-space:nowrap;
}
.submitlink:hover{background:var(--ink);color:var(--paper)}
.submitlink[hidden]{display:none}

.lede{margin:22px 0 0;font-size:17px;line-height:1.65;color:var(--ink-60)}
@media (max-width:620px){
  .lede{font-size:16px}
  .lede .wide-only{display:none}
}

/* ---------- search ---------- */
.searchbar{
  position:sticky;top:0;z-index:5;background:var(--paper);
  padding:18px 0 14px;margin-top:20px;border-bottom:1.5px solid var(--ink);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
#q{
  flex:1 1 280px;font:inherit;font-size:15px;padding:10px 12px;
  background:#fff;border:1px solid var(--rule);border-radius:0;color:var(--ink);
}
#q:focus{outline:2px solid var(--blue);outline-offset:-1px}
.hits{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-60);white-space:nowrap}

.status{
  margin:40px 0;font-family:"IBM Plex Mono",monospace;font-size:13px;
  color:var(--ink-60);line-height:1.7;
}
.status.error{color:var(--red)}
.status[hidden]{display:none}

/* ---------- season sections ---------- */
.season{margin-top:40px}
.season[hidden]{display:none}
.season > h2{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--rule);
}
.season .game{
  font-variation-settings:"wdth" 110,"wght" 800;
  font-size:clamp(22px,2.6vw,30px);letter-spacing:-.02em;text-transform:uppercase;
}
.season .yr{
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;
  color:var(--ink-60);font-weight:500;
}
.season .n{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  color:var(--ink-60);
}

.teams{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);
}
.card{background:var(--paper);padding:16px 16px 18px;display:flex;flex-direction:column}
.card[hidden]{display:none}
.card:hover{background:#EAECE8;cursor:pointer}

.card .team{margin:0;line-height:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .badge{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:#2A3134;background:var(--alu);
  padding:3px 7px;white-space:nowrap;
  border-top:1px solid #EDF0EE;border-bottom:1px solid #7E8684;
}
.card .also{
  margin:8px 0 0;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--ink-60);line-height:1.5;
}
.card .team a{
  font-variation-settings:"wdth" 108,"wght" 800;
  font-size:26px;letter-spacing:-.02em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;
  border-bottom:3px solid transparent;
}
.card:hover .team a,.card .team a:focus-visible{border-color:var(--red);color:var(--red)}
.card .team a:focus-visible{outline:none}
.card .tname{
  margin:6px 0 0;font-variation-settings:"wdth" 96,"wght" 600;font-size:13.5px;
}
.card .award{
  margin:6px 0 0;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  color:var(--red);line-height:1.5;
}
.card .award .record{color:var(--ink-60)}

.crest{margin:0 0 14px;display:flex;align-items:flex-start}
.crest img{display:block;max-width:84px;max-height:56px;object-fit:contain}

.empty{
  margin:60px 0;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-60);
}
.empty[hidden]{display:none}

footer a{color:var(--ink-60);text-decoration:none;border-bottom:1px solid var(--rule)}
footer a:hover{color:var(--ink);border-color:var(--ink)}
footer .row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}
footer{
  margin-top:48px;padding-top:18px;border-top:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-60);line-height:1.7;
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="mark">Robot <em>Archive</em></div>
    <div class="mast-right">
      <div class="count" id="count"></div>
      <a class="toollink" href="compress.html">Compress a model</a>
      <a class="submitlink" id="submitlink" href="submission.html" hidden>+ Add robot</a>
    </div>
  </header>

  <p class="lede">Every robot built by the program, season by season, with the students
    who built it. <span class="wide-only">Pick a team to see its robot in 3D.</span></p>

  <div class="searchbar">
    <input type="search" id="q" placeholder="Search team number, name, student, or season…"
           autocomplete="off" spellcheck="false">
    <span class="hits" id="hits"></span>
  </div>

  <p class="status" id="status">Loading roster…</p>
  <div id="sections"></div>
  <p class="empty" id="empty" hidden>No teams match that search.</p>

  <footer>
    <div class="row">
      <a href="index.html">Archive</a>
      <a href="about.html">About this project</a>
      <a href="compress.html">Compress a model</a>
      <a href="contact.html">Contact</a>
    </div>
    <span id="foot"></span>
  </footer>
</div>

<script>
(function(){
  const local = ["localhost","127.0.0.1","[::1]",""].includes(location.hostname);
  const el = document.getElementById("submitlink");
  if (local && el) el.hidden = false;
})();
</script>

<script>
const $ = id => document.getElementById(id);
const yearKey = s => (s.year || "").slice(0,4);
let LOGOS = new Map();

function card(s, history){
  const art = document.createElement("article");
  art.className = "card";
  const href = `robot-archive.html?team=${encodeURIComponent(s.team)}&year=${yearKey(s)}`;

  /* every year this team appears, so a card can point at the rest */
  const others = history.filter(y => y !== s.year);

  /* Searchable text. Student names are deliberately NOT indexed - the roster
     doesn't show them, and indexing would let anyone map a name to a team.
     Add ...(s.students||[]).map(x=>x.name) back here if you ever want it. */
  art.dataset.search = [
    s.team, s.teamName, s.game, s.year, s.program, s.award
  ].filter(Boolean).join(" ").toLowerCase();

  const logo = s.logo || LOGOS.get((s.team || "").toLowerCase());
  if (logo){
    const crest = document.createElement("div");
    crest.className = "crest";
    const img = new Image();
    img.src = logo; img.alt = `${s.teamName || s.team} logo`; img.loading = "lazy";
    img.onerror = () => crest.remove();      // no logo, no placeholder
    crest.append(img);
    art.append(crest);
  }

  const team = document.createElement("h3");
  team.className = "team";
  const a = document.createElement("a");
  a.href = href;
  a.textContent = s.team || "—";
  team.append(a);
  if (history.length > 1){
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = `${history.length} seasons`;
    team.append(b);
  }
  art.append(team);

  if (s.teamName){
    const tn = document.createElement("p");
    tn.className = "tname";
    tn.textContent = s.teamName;
    art.append(tn);
  }

  if (others.length){
    const al = document.createElement("p");
    al.className = "also";
    al.textContent = `Also built in ${others.join(" · ")}`;
    art.append(al);
  }

  if (s.award || s.record){
    const aw = document.createElement("p");
    aw.className = "award";
    aw.textContent = s.award || "";
    if (s.record){
      const r = document.createElement("span");
      r.className = "record";
      r.textContent = (s.award ? "  ·  " : "") + s.record;
      aw.append(r);
    }
    art.append(aw);
  }

  art.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    location.href = href;
  });
  return art;
}

(async function(){
  let data;
  try {
    const res = await fetch("robots.json", {cache:"no-cache"});
    if (!res.ok) throw new Error(`robots.json returned ${res.status}`);
    data = await res.json();
    if (!Array.isArray(data) || !data.length) throw new Error("robots.json is empty");
  } catch (err) {
    const s = $("status");
    s.className = "status error";
    s.textContent = location.protocol === "file:"
      ? "Open this through a local server, not by double-clicking the file. In this folder run: python3 -m http.server 8000"
      : `Could not load robots.json — ${err.message}`;
    return;
  }
  $("status").hidden = true;

  /* only teams with a scanned model appear on the roster */
  const shown  = data.filter(s => s.model);
  const hidden = data.length - shown.length;

  /* a team's logo may only have been submitted in one season */
  shown.forEach(s => {
    const k = (s.team || "").toLowerCase();
    if (s.logo && !LOGOS.has(k)) LOGOS.set(k, s.logo);
  });

  /* every year each team appears, oldest first */
  const history = new Map();
  shown.forEach(s => {
    const k = (s.team || "").toLowerCase();
    if (!history.has(k)) history.set(k, []);
    history.get(k).push(s.year);
  });
  history.forEach(v => v.sort());

  /* group by season, newest first */
  const groups = new Map();
  shown.forEach(s => {
    const k = `${yearKey(s)}|${s.game || ""}`;
    if (!groups.has(k)) groups.set(k, { year:s.year, game:s.game, rows:[] });
    groups.get(k).rows.push(s);
  });
  const ordered = [...groups.entries()]
    .sort((a,b) => b[0].localeCompare(a[0]))
    .map(([,g]) => g);

  const frag = document.createDocumentFragment();
  ordered.forEach(g => {
    const sec = document.createElement("section");
    sec.className = "season";
    const h = document.createElement("h2");
    h.innerHTML = `<span class="game">${g.game || "Unlabelled season"}</span>
                   <span class="yr">${g.year || ""}</span>
                   <span class="n">${g.rows.length} team${g.rows.length===1?"":"s"}</span>`;
    const grid = document.createElement("div");
    grid.className = "teams";
    g.rows.sort((a,b) => (a.team||"").localeCompare(b.team||"", undefined, {numeric:true}));
    grid.append(...g.rows.map(s => card(s, history.get((s.team||"").toLowerCase()) || [s.year])));
    sec.append(h, grid);
    frag.append(sec);
  });
  $("sections").append(frag);

  const teams = new Set(shown.map(s => s.team));
  $("count").textContent = `${teams.size} teams · ${shown.length} robots`;
  $("foot").textContent = hidden
    ? `${hidden} entr${hidden===1?"y":"ies"} have no 3D model yet — they appear here once one is added.`
    : "";

  /* ---------------- search ---------------- */
  const q = $("q");
  function filter(){
    const term = q.value.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll(".season").forEach(sec => {
      let n = 0;
      sec.querySelectorAll(".card").forEach(c => {
        const hit = !term || c.dataset.search.includes(term);
        c.hidden = !hit;
        if (hit) n++;
      });
      sec.hidden = n === 0;
      sec.querySelector(".n").textContent = `${n} team${n===1?"":"s"}`;
      visible += n;
    });
    $("empty").hidden = visible > 0;
    $("hits").textContent = term ? `${visible} match${visible===1?"":"es"}` : "";
  }
  q.addEventListener("input", filter);
  q.addEventListener("keydown", e => { if (e.key === "Escape"){ q.value=""; filter(); } });
})();
</script>
</body>
</html>
