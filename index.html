<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F2; --ink:#12171A; --ink-60:#5A6468; --tile:#9AA4A2;
  --rule:#C9CDC9; --red:#E4002B; --blue:#0072CE; --alu:#B4BAB8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;font-variation-settings:"wdth" 100;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 72px}

.masthead{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-bottom:14px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap;
}
.mark{
  font-variation-settings:"wdth" 118,"wght" 800;
  font-size:clamp(18px,2.4vw,26px);letter-spacing:-.01em;text-transform:uppercase;
}
.mark em{font-style:normal;color:var(--red)}
.mast-right{display:flex;align-items:center;gap:16px}
.count{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-60);
  letter-spacing:.06em;text-transform:uppercase;
}
.adminlink{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;color:var(--ink);
  border:1.5px solid var(--ink);padding:6px 12px;white-space:nowrap;
  transition:background .15s ease,color .15s ease;
}
.adminlink:hover{background:var(--ink);color:var(--paper)}
.adminlink[hidden]{display:none}

.lede{
  margin:22px 0 0;max-width:56ch;font-size:15.5px;line-height:1.65;color:var(--ink-60);
}

.status{
  margin:40px 0;font-family:"IBM Plex Mono",monospace;font-size:13px;
  color:var(--ink-60);line-height:1.7;
}
.status.error{color:var(--red)}
.status[hidden]{display:none}

/* ---------- roster grid ---------- */
.roster{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:32px;
}
.card{
  background:var(--paper);padding:22px 22px 24px;display:flex;flex-direction:column;
  transition:background .15s ease;
}
.card:hover{background:#EAECE8}

.card .season{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-60);margin:0 0 10px;
}
.card .team{margin:0;line-height:1}
.card .team a{
  font-variation-settings:"wdth" 112,"wght" 800;
  font-size:clamp(26px,3vw,36px);letter-spacing:-.02em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;display:inline-block;
  border-bottom:3px solid transparent;transition:border-color .15s ease,color .15s ease;
}
.card .team a:hover,.card .team a:focus-visible{border-color:var(--red);color:var(--red)}
.card .team a:focus-visible{outline:none}

.card .game{
  margin:10px 0 0;font-variation-settings:"wdth" 96,"wght" 600;font-size:16px;
}
.card .award{
  margin:6px 0 0;font-family:"IBM Plex Mono",monospace;font-size:12px;
  color:var(--red);line-height:1.5;
}
.card .record{color:var(--ink-60)}

.crew{
  list-style:none;margin:18px 0 0;padding:16px 0 0;border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:14px 10px;
}
.crew figure{margin:0}
.crew img,.crew .fallback{
  display:block;width:56px;height:56px;border-radius:50%;object-fit:cover;
  border:2.5px solid var(--paper);background:var(--tile);margin:0 auto 7px;
}
.crew .fallback{
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;
  font-size:16px;font-weight:600;color:var(--paper);
}
.crew figcaption{
  font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.35;
  text-align:center;word-break:break-word;
}

.card .view{
  margin-top:auto;padding-top:18px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-60);
}

footer{
  margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-60);
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="mark">Robot <em>Archive</em></div>
    <div class="mast-right">
      <div class="count" id="count"></div>
      <a class="adminlink" id="adminlink" href="submission.html" hidden>+ Add robot</a>
    </div>
  </header>

  <p class="lede">Every robot built by the program, season by season, with the students
    who built it. Pick a team to see its robot in 3D.</p>

  <p class="status" id="status">Loading roster…</p>

  <div class="roster" id="roster"></div>

  <footer id="foot"></footer>
</div>

<script>
(function(){
  const local = ["localhost","127.0.0.1","[::1]",""].includes(location.hostname);
  if (local) document.getElementById("adminlink").hidden = false;
})();
</script>

<script>
const $ = id => document.getElementById(id);
const slug = s => (s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const slugOf = s => `${(s.year||"").slice(0,4)}-${slug(s.game)}`;

const initialsColors = ["#3A4245","#5B6A6E","#46504F","#6A7472"];
function avatar(student, i){
  const li = document.createElement("li");
  const fig = document.createElement("figure");
  const initials = (student.name||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const fb = () => {
    const d = document.createElement("div");
    d.className = "fallback";
    d.style.background = initialsColors[i % initialsColors.length];
    d.textContent = initials;
    return d;
  };
  if (student.photo){
    const img = new Image();
    img.src = student.photo; img.alt = student.name;
    img.onerror = () => img.replaceWith(fb());
    fig.append(img);
  } else fig.append(fb());
  const cap = document.createElement("figcaption");
  cap.textContent = student.name;
  fig.append(cap);
  li.append(fig);
  return li;
}

function card(s){
  const art = document.createElement("article");
  art.className = "card";
  const href = `robot-archive.html?robot=${slugOf(s)}`;

  const season = document.createElement("p");
  season.className = "season";
  season.textContent = `${s.program || ""} · ${s.year || ""}`.replace(/^ · | · $/,"");

  const team = document.createElement("h2");
  team.className = "team";
  const a = document.createElement("a");
  a.href = href;
  a.textContent = s.team || s.game || "Team";
  team.append(a);

  const game = document.createElement("p");
  game.className = "game";
  game.textContent = s.game || "";

  const award = document.createElement("p");
  award.className = "award";
  award.textContent = s.award || "";
  if (s.record){
    const rec = document.createElement("span");
    rec.className = "record";
    rec.textContent = (s.award ? "  ·  " : "") + s.record;
    award.append(rec);
  }

  const crew = document.createElement("ul");
  crew.className = "crew";
  crew.append(...(s.students || []).map(avatar));

  const view = document.createElement("p");
  view.className = "view";
  view.textContent = "View robot →";

  art.append(season, team, game, award, crew, view);

  /* the whole card is clickable, but the team name stays the real link */
  art.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    location.href = href;
  });
  return art;
}

(async function(){
  let data;
  try {
    const res = await fetch("robots.json", {cache:"no-cache"});
    if (!res.ok) throw new Error(`robots.json returned ${res.status}`);
    data = await res.json();
    if (!Array.isArray(data) || !data.length) throw new Error("robots.json is empty");
  } catch (err) {
    const s = $("status");
    s.className = "status error";
    s.textContent = location.protocol === "file:"
      ? "Open this through a local server, not by double-clicking the file. In this folder run: python3 -m http.server 8000"
      : `Could not load robots.json — ${err.message}`;
    return;
  }

  $("status").hidden = true;

  /* newest first on the roster — the viewer keeps chronological order */
  const ordered = [...data].reverse();
  $("roster").append(...ordered.map(card));

  const names = new Set();
  data.forEach(s => (s.students || []).forEach(st => names.add(st.name)));
  $("count").textContent = `${data.length} robots · ${names.size} students`;
  $("foot").textContent =
    `${data[0].year} – ${data[data.length-1].year}`;
})();
</script>
</body>
</html>
