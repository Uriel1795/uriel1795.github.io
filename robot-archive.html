<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Archive</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12171A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Required. The addon modules (OrbitControls, GLTFLoader) import from the
     bare specifier "three", which browsers cannot resolve on their own.
     This must appear before any <script type="module">. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
:root{
  --paper:#F3F4F2;
  --ink:#12171A;
  --ink-60:#5A6468;
  --stage:#151B1E;
  --tile:#9AA4A2;
  --rule:#C9CDC9;
  --red:#E4002B;
  --blue:#0072CE;
  --alu:#B4BAB8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;
  font-variation-settings:"wdth" 100;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 64px}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;padding-bottom:14px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap;
}
.mark{
  font-variation-settings:"wdth" 118,"wght" 800;
  font-size:clamp(18px,2.4vw,26px);letter-spacing:-.01em;text-transform:uppercase;
}
.mark em{font-style:normal;color:var(--red)}
.mark a{color:inherit;text-decoration:none}
.mark a:hover{color:var(--red)}
.mark a:hover em{color:var(--ink)}
.masthead .count{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-60);
  letter-spacing:.06em;text-transform:uppercase;
}
.mast-right{display:flex;align-items:center;gap:16px}
.toollink{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;color:var(--ink-60);
  border-bottom:1.5px solid var(--rule);padding-bottom:3px;white-space:nowrap;
  transition:color .15s ease,border-color .15s ease;
}
.toollink:hover{color:var(--ink);border-color:var(--ink)}
.submitlink{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;color:var(--ink);
  border:1.5px solid var(--ink);padding:6px 12px;white-space:nowrap;
  transition:background .15s ease,color .15s ease;
}
.submitlink:hover{background:var(--ink);color:var(--paper)}
.submitlink[hidden]{display:none}

/* section eyebrows, shared */
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-60);font-weight:500;margin:0 0 10px;
}

/* ---------- showcase: canvas + plate ---------- */
.showcase{position:relative;margin-top:20px}
.stage{position:relative;background:var(--stage);aspect-ratio:16/9;min-height:340px;overflow:hidden}
#view{display:block;width:100%;height:100%}

.plate{
  position:absolute;top:22px;left:22px;
  background:var(--paper);padding:16px 20px 18px;max-width:340px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
.plate .program{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-60);margin:0;
}
.title{margin:6px 0 0;line-height:.92}
.title .game{
  display:block;font-variation-settings:"wdth" 112,"wght" 800;
  font-size:clamp(30px,3.6vw,46px);letter-spacing:-.025em;text-transform:uppercase;
}
.title .year{
  display:block;margin-top:8px;font-family:"IBM Plex Mono",monospace;
  font-size:13px;letter-spacing:.16em;color:var(--ink-60);
}
.plate .team{
  margin:14px 0 0;padding-top:12px;border-top:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.6;
}
.plate .team b{font-weight:600}
.plate .team .award{color:var(--red)}

.hint{
  position:absolute;right:22px;bottom:22px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(243,244,242,.42);
}
.status{
  position:absolute;left:0;right:0;bottom:50%;text-align:center;padding:0 24px;
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(243,244,242,.55);line-height:1.6;
}
.status[hidden]{display:none}
.status.error{color:#FF8AA0;text-transform:none;letter-spacing:.02em;font-size:13px}

/* ---------- crew ---------- */
/* Students appear in their own "Built by" section below the canvas.
   The plate now leads with the team logo instead. */
.crew{list-style:none;padding:0}
.crew figure{margin:0;position:relative}
.crew img,.crew .fallback{
  display:block;border-radius:50%;object-fit:cover;
  border:2.5px solid var(--paper);background:var(--tile);
}
.crew .fallback{
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;
  font-weight:600;color:var(--paper);letter-spacing:.02em;
}

/* --- in-plate variant --- */
.crest{margin:0 0 12px}
.crest img{display:block;max-width:96px;max-height:96px;object-fit:contain}
.crest .monogram{
  display:inline-block;padding:9px 13px;background:var(--alu);
  border-top:1.5px solid #EDF0EE;border-bottom:1.5px solid #7E8684;
  font-variation-settings:"wdth" 108,"wght" 800;font-size:22px;letter-spacing:-.01em;
  color:#232A2C;text-transform:uppercase;
}
.teamname{
  margin:0 0 12px;font-variation-settings:"wdth" 100,"wght" 700;
  font-size:17px;line-height:1.2;
}
.teamname:empty{display:none}


/* --- standalone section variant (mobile) --- */
.crew-section{margin-top:38px;padding-top:22px;border-top:1.5px solid var(--ink)}
.crew-section[hidden]{display:none}
.crew-section .crew{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:18px 12px;margin:0;
}
.crew-section .crew li{text-align:center}
.crew-section .crew img,.crew-section .crew .fallback{
  width:64px;height:64px;font-size:18px;margin:0 auto 8px;
}
.crew-section .crew figcaption{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.35;
  color:var(--ink);word-break:break-word;
}

/* ---------- season rail ---------- */
.rail{margin-top:34px}
.channel{
  position:relative;display:flex;overflow-x:auto;scrollbar-width:thin;
  background:linear-gradient(180deg,#DDE1DF 0%,var(--alu) 18%,#A7AEAC 82%,#8E9694 100%);
  border-top:1.5px solid #EDF0EE;border-bottom:1.5px solid #7E8684;padding:0 6px;
}
.bay{
  flex:0 0 auto;position:relative;border:0;background:none;cursor:pointer;
  padding:16px 10px 14px;font:inherit;color:var(--ink);text-align:center;min-width:104px;
}
.bay:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.hole{
  width:26px;height:26px;margin:0 auto 9px;border-radius:7px;background:#2B3234;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.55);
  display:grid;place-items:center;transition:background .18s ease;
}
.bay:hover .hole{background:#20272A}
.bolt{width:16px;height:16px;opacity:0;transform:rotate(-25deg);
  transition:opacity .18s ease,transform .3s ease}
.bay[aria-current="true"] .hole{background:#39413F}
.bay[aria-current="true"] .bolt{opacity:1;transform:rotate(0deg)}
.bay .lab{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.04em;color:#3A4245;white-space:nowrap;
}
.bay[aria-current="true"] .lab{color:var(--ink);font-weight:600}
.bay .gm{
  display:block;font-size:12px;font-variation-settings:"wdth" 92,"wght" 600;
  text-transform:uppercase;color:#4C5457;margin-top:3px;
}
.bay[aria-current="true"] .gm{color:var(--ink)}

/* ---------- specs + note ---------- */
.specs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:26px;
}
.specs div{background:var(--paper);padding:14px 16px}
.specs dt{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-60);margin:0 0 6px;
}
.specs dd{margin:0;font-size:15px;font-variation-settings:"wdth" 96,"wght" 600}
.extra{margin-top:38px;padding-top:22px;border-top:1.5px solid var(--ink)}
.extra[hidden]{display:none}

.notebook{
  display:flex;align-items:center;gap:18px;padding:18px 20px;
  border:1px solid var(--rule);background:#fff;text-decoration:none;color:var(--ink);
  transition:border-color .15s ease,background .15s ease;
}
.notebook:hover{border-color:var(--ink);background:#FAFBF9}
.nb-ico{width:30px;height:40px;flex:0 0 auto;color:var(--ink-60)}
.notebook:hover .nb-ico{color:var(--red)}
.nb-text{display:flex;flex-direction:column;gap:5px;min-width:0}
.nb-title{font-variation-settings:"wdth" 100,"wght" 700;font-size:16px}
.nb-meta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-60)}
.nb-go{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
}

.mementos{
  list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;
}
.mementos li{margin:0}
.mementos button{
  display:block;width:100%;padding:0;border:1px solid var(--rule);background:#fff;
  cursor:zoom-in;text-align:left;
}
.mementos button:hover{border-color:var(--ink)}
.mementos img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.mementos figcaption{
  padding:9px 11px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  line-height:1.45;color:var(--ink-60);
}

.lightbox{
  position:fixed;inset:0;z-index:50;background:rgba(12,16,18,.94);
  display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;
}
.lightbox[hidden]{display:none}
.lb-fig{margin:0;max-width:min(1100px,92vw);max-height:88vh;display:flex;
  flex-direction:column;gap:12px;align-items:center}
.lb-fig img{max-width:100%;max-height:78vh;object-fit:contain;background:#0C1012}
.lb-fig figcaption{
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:#C9CFCD;text-align:center;
}
.lb-close,.lb-nav{
  background:none;border:0;color:#C9CFCD;cursor:pointer;font-size:34px;line-height:1;
  padding:10px 14px;flex:0 0 auto;
}
.lb-close{position:absolute;top:10px;right:14px;font-size:38px}
.lb-close:hover,.lb-nav:hover{color:#fff}
.lb-nav[hidden]{visibility:hidden;display:block}
@media (max-width:620px){
  .notebook{flex-wrap:wrap;gap:12px}
  .nb-go{margin-left:0;width:100%}
  .lb-nav{font-size:26px;padding:8px}
}

footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-60);line-height:1.9}
footer a{color:var(--ink-60);text-decoration:none;border-bottom:1px solid var(--rule)}
footer a:hover{color:var(--ink);border-color:var(--ink)}
footer .row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}
.note{margin-top:26px;max-width:62ch;font-size:14px;line-height:1.65;color:var(--ink-60)}

/* ---------- mobile: robot and crew become separate sections ---------- */
@media (max-width:720px){
  .wrap{padding:16px 16px 48px}
  .stage{aspect-ratio:1/1;min-height:0}
  .hint{display:none}
  .plate{
    position:static;max-width:none;box-shadow:none;
    padding:18px 0 0;background:none;
  }
  .plate .team{font-size:12.5px}
  .specs{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="mark"><a href="index.html">← Robot <em>Archive</em></a></div>
    <div class="mast-right">
      <div class="count" id="count"></div>
      <a class="toollink" href="compress.html">Compress a model</a>
      <a class="submitlink" id="submitlink" href="submission.html">+ Add robot</a>
    </div>
  </header>

  <div class="showcase">
    <div class="stage">
      <canvas id="view"></canvas>
      <p class="status" id="status">Loading archive…</p>
      <p class="hint">Drag to orbit · scroll to zoom</p>
    </div>

    <article class="plate">
      <div class="crest" id="crest"></div>
      <p class="teamname" id="teamname"></p>
      <p class="program" id="program"></p>
      <h1 class="title">
        <span class="game" id="game"></span>
        <span class="year" id="year"></span>
      </h1>
      <p class="team" id="team"></p>
    </article>
  </div>

  <section class="crew-section" id="crew-section" aria-labelledby="crew-heading">
    <h2 class="eyebrow" id="crew-heading">Built by</h2>
  </section>

  <ul class="crew" id="crew"></ul>

  <nav class="rail" aria-label="Season">
    <h2 class="eyebrow">Seasons</h2>
    <div class="channel" id="channel" role="tablist"></div>
  </nav>

  <dl class="specs" id="specs"></dl>
  <p class="note" id="note"></p>

  <section class="extra" id="notebook-sec" hidden aria-labelledby="nb-h">
    <h2 class="eyebrow" id="nb-h">Judges notebook</h2>
    <a class="notebook" id="notebook" target="_blank" rel="noopener">
      <svg class="nb-ico" viewBox="0 0 24 32" aria-hidden="true">
        <path d="M3 1h13l5 5v25H3z" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M16 1v5h5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M7 12h10M7 16h10M7 20h6" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <span class="nb-text">
        <span class="nb-title">Engineering notebook</span>
        <span class="nb-meta" id="nb-meta"></span>
      </span>
      <span class="nb-go">Open PDF &rarr;</span>
    </a>
  </section>

  <section class="extra" id="mementos-sec" hidden aria-labelledby="mm-h">
    <h2 class="eyebrow" id="mm-h">Mementos</h2>
    <ul class="mementos" id="mementos"></ul>
  </section>
  <footer>
    <div class="row">
      <a href="index.html">Archive</a>
      <a href="about.html">About this project</a>
      <a href="compress.html">Compress a model</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">&#8249;</button>
  <figure class="lb-fig">
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lb-next" aria-label="Next">&#8250;</button>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

window.__ARCHIVE_OK__ = true;
const el = id => document.getElementById(id);
const statusEl = el("status");

/* ============================================================
   Data comes from the API. Point DATA_URL at "robots.json" to fall back to
   the static file in this repo if the API is ever down.
   ============================================================ */
const DATA_URL = "https://robot-archive-api-production.up.railway.app/api/robots";

let SEASONS = [];
try {
  const res = await fetch(DATA_URL, {cache:"no-cache"});
  if (!res.ok) throw new Error(`the archive returned ${res.status}`);
  SEASONS = await res.json();
  if (!Array.isArray(SEASONS)) throw new Error("unexpected response");
} catch (err) {
  statusEl.className = "status error";
  statusEl.textContent = `Could not load the archive \u2014 ${err.message}.`;
  throw err;
}

/* ---------------- three.js scene ---------------- */
const ALLIANCE = ["#E4002B", "#0072CE"];
const canvas = el("view");
const stage  = canvas.parentElement;

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151B1E);
scene.fog = new THREE.Fog(0x151B1E, 9, 22);

const camera = new THREE.PerspectiveCamera(38, 16/9, .1, 100);
camera.position.set(4.2, 2.9, 5.2);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.target.set(0, .85, 0);
controls.minDistance = 3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI/2 - .04;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
controls.autoRotate = !reduced;
controls.autoRotateSpeed = .55;
canvas.addEventListener("pointerdown", () => controls.autoRotate = false);

scene.add(new THREE.HemisphereLight(0xdfe6e8, 0x2a3134, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.35);
key.position.set(4, 8, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -6;
key.shadow.camera.right = key.shadow.camera.top = 6;
key.shadow.bias = -0.0006;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb4d6, .55);
rim.position.set(-5, 3, -4);
scene.add(rim);

function tileTexture(){
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const x = c.getContext("2d");
  x.fillStyle = "#8E9895"; x.fillRect(0,0,512,512);
  for (let i=0;i<4;i++) for (let j=0;j<4;j++){
    const s = 128, p = 5;
    x.fillStyle = ["#9AA4A2","#95A09D","#9EA8A5","#929C9A"][(i+j)%4];
    x.fillRect(i*s+p, j*s+p, s-p*2, s-p*2);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2,2);
  return t;
}
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(16,16),
  new THREE.MeshStandardMaterial({map:tileTexture(), roughness:.94, metalness:0})
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

function channelTexture(){
  const c = document.createElement("canvas");
  c.width = 256; c.height = 64;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0,0,0,64);
  g.addColorStop(0,"#D6DBD9"); g.addColorStop(.45,"#B4BAB8"); g.addColorStop(1,"#8F9694");
  x.fillStyle = g; x.fillRect(0,0,256,64);
  x.fillStyle = "#2E3538";
  for (let i=0;i<8;i++){
    x.beginPath(); x.roundRect(i*32+7, 23, 18, 18, 5); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const CHANNEL = channelTexture();
const aluMat = new THREE.MeshStandardMaterial({map:CHANNEL, roughness:.42, metalness:.75});
const rubber = new THREE.MeshStandardMaterial({color:0x1a1d1f, roughness:.95});

function bar(len, w, h, repeat){
  const m = aluMat.clone();
  m.map = CHANNEL.clone(); m.map.needsUpdate = true;
  m.map.repeat.set(repeat, 1);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(len, h, w), m);
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

function buildStandIn(accent){
  const g = new THREE.Group();
  const hub = new THREE.MeshStandardMaterial({color:accent, roughness:.5, metalness:.15});
  [-.62,.62].forEach(z=>{ const b = bar(2.2,.16,.34,3); b.position.set(0,.42,z); g.add(b); });
  [-.9,.9].forEach(x=>{ const b = bar(1.24,.16,.3,2); b.rotation.y = Math.PI/2; b.position.set(x,.42,0); g.add(b); });
  [[-.78,-.7],[.78,-.7],[-.78,.7],[.78,.7]].forEach(([x,z])=>{
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.24,28), rubber);
    tire.rotation.x = Math.PI/2; tire.position.set(x,.4,z); tire.castShadow = true; g.add(tire);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.27,20), hub);
    cap.rotation.x = Math.PI/2; cap.position.set(x,.4,z); g.add(cap);
  });
  [-.5,.5].forEach(z=>{ const t = bar(1.5,.14,.26,2); t.rotation.z = Math.PI/2; t.position.set(-.15,1.3,z); g.add(t); });
  const cross = bar(1.1,.12,.2,1); cross.rotation.y = Math.PI/2; cross.position.set(-.15,1.95,0); g.add(cross);
  const arm = bar(.95,.13,.22,1); arm.rotation.z = -.34; arm.position.set(.42,1.62,0); g.add(arm);
  const roller = new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,1.05,20), hub);
  roller.rotation.x = Math.PI/2; roller.position.set(.86,1.32,0); roller.castShadow = true; g.add(roller);
  const brain = new THREE.Mesh(new THREE.BoxGeometry(.62,.16,.44),
    new THREE.MeshStandardMaterial({color:0x23292c, roughness:.6}));
  brain.position.set(-.15,.62,0); brain.castShadow = true; g.add(brain);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(.3,.2), new THREE.MeshBasicMaterial({color:accent}));
  screen.rotation.x = -Math.PI/2; screen.position.set(-.15,.705,0); g.add(screen);
  return g;
}

/* Optimised models arrive compressed. Draco and Meshopt both need a decoder
   wired in, or GLTFLoader fails and you get the stand-in robot with a console
   error. The decoder files are fetched from the CDN on first use only — an
   uncompressed model never downloads them. */
const draco = new DRACOLoader();
draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/");

const loader = new GLTFLoader();
loader.setDRACOLoader(draco);
loader.setMeshoptDecoder(MeshoptDecoder);
let current = null, token = 0;

function countTriangles(obj){
  let tris = 0, meshes = 0;
  obj.traverse(n => {
    if (!n.isMesh || !n.geometry) return;
    meshes++;
    const g = n.geometry;
    tris += (g.index ? g.index.count : g.attributes.position?.count ?? 0) / 3;
  });
  return { tris: Math.round(tris), meshes };
}

/**
 * Heavy models are usually slow because of the shadow pass, not the model —
 * shadows re-render every triangle from the light's point of view, so a
 * million-triangle robot becomes two million per frame. Above a threshold,
 * drop shadows and the pixel ratio rather than dropping the model.
 */
const HEAVY = 250_000;

function tuneQuality(obj){
  const { tris, meshes } = countTriangles(obj);
  const heavy = tris > HEAVY;

  renderer.shadowMap.enabled = !heavy;
  key.castShadow = !heavy;
  floor.receiveShadow = !heavy;
  renderer.setPixelRatio(heavy ? 1 : Math.min(devicePixelRatio, 2));

  obj.traverse(n => {
    if (!n.isMesh) return;
    n.castShadow = n.receiveShadow = !heavy;
    n.frustumCulled = true;
  });

  if (heavy){
    console.info(
      `Heavy model: ${tris.toLocaleString()} triangles in ${meshes} meshes. ` +
      `Shadows off to keep it interactive. Re-compress to under ` +
      `${HEAVY.toLocaleString()} triangles for a smoother result.`
    );
  }
  return { tris, meshes, heavy };
}

let heavyLoaded = false;

function place(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const k = 2.2 / Math.max(size.x, size.y, size.z);
  if (isFinite(k) && k > 0) obj.scale.setScalar(k);
  const b2 = new THREE.Box3().setFromObject(obj);
  const c = b2.getCenter(new THREE.Vector3());
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= b2.min.y;
  heavyLoaded = tuneQuality(obj).heavy;
}

/* Fit the camera to the model rather than sitting at a fixed distance.
   A long flat drivebase and a tall tower need very different framing. */
function frame(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const radius = 0.5 * size.length();
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const dist = (radius / Math.sin(fov / 2)) * 0.82;   // 0.82 = a little margin

  const dir = new THREE.Vector3(0.60, 0.40, 0.69).normalize();
  camera.position.copy(centre).add(dir.multiplyScalar(dist));
  controls.target.copy(centre);
  controls.minDistance = radius * 0.7;
  controls.maxDistance = radius * 7;
  controls.update();
}

function show(entry, index){
  const mine = ++token;
  if (current){ scene.remove(current); current = null; }
  const accent = ALLIANCE[index % 2];
  statusEl.className = "status";
  statusEl.hidden = false;
  statusEl.textContent = "Loading build…";

  const done = obj => {
    if (mine !== token) return;
    const q = place(obj) || {};
    obj.rotation.y = -0.5;
    scene.add(obj);
    frame(obj);
    /* Auto-rotation forces a redraw every frame. On a heavy model that's the
       difference between "slow" and "still". Let the visitor spin it instead. */
    controls.autoRotate = !reduced && !heavyLoaded;
    current = obj;
    statusEl.hidden = true;
    controls.autoRotate = !reduced;
  };

  if (!entry.model) return done(buildStandIn(accent));
  loader.load(entry.model,
    gltf => done(gltf.scene),
    ev => {
      if (mine === token && ev.lengthComputable)
        statusEl.textContent = `Loading build… ${Math.round(ev.loaded/ev.total*100)}%`;
    },
    err => {
      console.error(`Could not load ${entry.model}:`, err);
      done(buildStandIn(accent));
    }
  );
}

/* ---------------- crew rendering ---------------- */
const initialsColors = ["#3A4245","#5B6A6E","#46504F","#6A7472"];
function avatar(student, i){
  const li = document.createElement("li");
  const fig = document.createElement("figure");
  const initials = student.name.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const fb = () => {
    const d = document.createElement("div");
    d.className = "fallback";
    d.style.background = initialsColors[i % initialsColors.length];
    d.textContent = initials;
    return d;
  };
  if (student.photo){
    const img = new Image();
    img.src = student.photo; img.alt = student.name;
    img.onerror = () => img.replaceWith(fb());
    fig.append(img);
  } else fig.append(fb());
  const cap = document.createElement("figcaption");
  cap.textContent = student.name;
  fig.append(cap);
  li.append(fig);
  li.tabIndex = 0;
  return li;
}

const crewList = el("crew");
el("crew-section").append(crewList);

function renderCrest(s){
  const crest = el("crest");
  const logo = s.logo || teamLogo;
  if (logo){
    const img = new Image();
    img.src = logo;
    img.alt = `${s.teamName || teamLabel || s.team} logo`;
    img.onerror = () => img.replaceWith(monogram(s));
    crest.replaceChildren(img);
  } else {
    crest.replaceChildren(monogram(s));
  }
  el("teamname").textContent = s.teamName || teamLabel || "";
}
function monogram(s){
  const d = document.createElement("div");
  d.className = "monogram";
  d.textContent = s.team || "";
  return d;
}

/* ---------------- scope to one team ---------------- */
/* The viewer only ever shows one team's robots. Without ?team= there is
   nothing to show, so send the visitor back to the roster. */
const params = new URLSearchParams(location.search);
const teamId = (params.get("team") || "").trim();
if (!teamId){ location.replace("index.html"); throw new Error("no team"); }

const yearKey = s => (s.year || "").slice(0,4);
const ENTRIES = SEASONS
  .filter(s => (s.team || "").toLowerCase() === teamId.toLowerCase())
  .sort((a,b) => yearKey(a).localeCompare(yearKey(b)));

/* A team's logo or name may only have been filled in for one season —
   use whichever entry has one. Declared here, after ENTRIES exists;
   renderCrest is defined above but only runs from render(). */
const teamLogo  = (ENTRIES.find(e => e.logo) || {}).logo || null;
const teamLabel = (ENTRIES.find(e => e.teamName) || {}).teamName || "";

if (!ENTRIES.length){
  statusEl.className = "status error";
  statusEl.textContent = `No robots on file for team ${teamId}.`;
  el("count").textContent = "";
  throw new Error("unknown team");
}

/* ---------------- notebook + mementos ---------------- */
function renderNotebook(s){
  const sec = el("notebook-sec");
  const nb = s.notebook;
  const url = typeof nb === "string" ? nb : nb && nb.file;
  if (!url){ sec.hidden = true; return; }
  sec.hidden = false;
  el("notebook").href = url;
  const bits = [];
  if (nb.pages) bits.push(`${nb.pages} pages`);
  if (nb.note)  bits.push(nb.note);
  el("nb-meta").textContent = bits.join("  \u00b7  ") || url.split("/").pop();
}

let LB = [], lbAt = 0;

function renderMementos(s){
  const sec = el("mementos-sec");
  const items = (s.mementos || []).filter(m => m && (m.image || typeof m === "string"))
    .map(m => typeof m === "string" ? { image:m } : m);
  LB = items;
  if (!items.length){ sec.hidden = true; return; }
  sec.hidden = false;
  el("mementos").replaceChildren(...items.map((m,i)=>{
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    const fig = document.createElement("figure");
    fig.style.margin = "0";
    const img = new Image();
    img.src = m.image; img.alt = m.caption || ""; img.loading = "lazy";
    fig.append(img);
    if (m.caption){
      const c = document.createElement("figcaption");
      c.textContent = m.caption;
      fig.append(c);
    }
    b.append(fig);
    b.addEventListener("click", ()=>openLightbox(i));
    li.append(b);
    return li;
  }));
}

function openLightbox(i){
  lbAt = i;
  const m = LB[i];
  el("lb-img").src = m.image;
  el("lb-img").alt = m.caption || "";
  el("lb-cap").textContent = m.caption || "";
  el("lb-prev").hidden = LB.length < 2;
  el("lb-next").hidden = LB.length < 2;
  el("lightbox").hidden = false;
  el("lb-close").focus();
}
function stepLightbox(d){
  if (!LB.length) return;
  openLightbox((lbAt + d + LB.length) % LB.length);
}
el("lb-close").addEventListener("click", ()=>{ el("lightbox").hidden = true; });
el("lb-prev").addEventListener("click", ()=>stepLightbox(-1));
el("lb-next").addEventListener("click", ()=>stepLightbox(1));
el("lightbox").addEventListener("click", e=>{
  if (e.target === el("lightbox")) el("lightbox").hidden = true;
});
addEventListener("keydown", e=>{
  if (el("lightbox").hidden) return;
  if (e.key === "Escape") el("lightbox").hidden = true;
  if (e.key === "ArrowLeft")  stepLightbox(-1);
  if (e.key === "ArrowRight") stepLightbox(1);
});

/* ---------------- page rendering ---------------- */
function render(i){
  const s = ENTRIES[i];
  history.replaceState(null, "", `?team=${encodeURIComponent(s.team)}&year=${yearKey(s)}`);
  document.title = `Team ${s.team} · ${s.game} ${s.year} — Robot Archive`;
  renderCrest(s);
  const crew = s.students || [];
  el("crew-section").hidden = !crew.length;
  crewList.replaceChildren(...crew.map(avatar));
  el("program").textContent = s.program;
  el("game").textContent = s.game;
  el("year").textContent = s.year;
  const line = [`<b>Team ${s.team}</b>`, s.record].filter(Boolean).join(" · ");
  el("team").innerHTML = s.award
    ? `${line}<br><span class="award">${s.award}</span>`
    : line;
  el("specs").replaceChildren(...Object.entries(s.specs || {}).map(([k,v])=>{
    const d = document.createElement("div");
    d.innerHTML = `<dt>${k}</dt><dd>${v}</dd>`;
    return d;
  }));
  el("note").textContent = s.note || "";
  renderNotebook(s);
  renderMementos(s);
  document.querySelectorAll(".bay").forEach((b,j)=>b.setAttribute("aria-current", j===i));
  show(s, i);
}

const BOLT = `<svg class="bolt" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#C9CFCD"/>
  <path d="M12 5.6 17.8 8.9v6.2L12 18.4 6.2 15.1V8.9z" fill="#7C8482"/></svg>`;

const channel = el("channel");
const rail = document.querySelector(".rail");
if (ENTRIES.length < 2){
  rail.hidden = true;                       // one robot — nothing to switch between
} else {
  ENTRIES.forEach((s,i)=>{
    const b = document.createElement("button");
    b.className = "bay"; b.type = "button"; b.setAttribute("role","tab");
    b.innerHTML = `<div class="hole">${BOLT}</div><span class="lab">${s.year}</span><span class="gm">${s.game}</span>`;
    b.addEventListener("click", ()=>render(i));
    channel.append(b);
  });
  channel.addEventListener("keydown", e=>{
    const bays = [...channel.querySelectorAll(".bay")];
    const at = bays.findIndex(b=>b.getAttribute("aria-current")==="true");
    if (e.key === "ArrowRight" && at < bays.length-1){ bays[at+1].click(); bays[at+1].focus(); }
    if (e.key === "ArrowLeft"  && at > 0){ bays[at-1].click(); bays[at-1].focus(); }
  });
}
el("count").textContent = ENTRIES.length > 1
  ? `Team ${teamId} · ${ENTRIES.length} robots`
  : `Team ${teamId}`;

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

/* Render only when something changed. A static model at rest costs nothing,
   which matters far more on a heavy scene than on a light one. */
let needsRender = true;
controls.addEventListener("change", () => { needsRender = true; });
addEventListener("resize", () => { needsRender = true; });

(function loop(){
  requestAnimationFrame(loop);
  const moving = controls.update();      // true while damping or auto-rotating
  if (moving || needsRender){
    renderer.render(scene, camera);
    needsRender = false;
  }
})();

/* Open ?year= if given, else this team's most recent robot. */
const wantYear = params.get("year");
const start = wantYear ? ENTRIES.findIndex(s => yearKey(s) === wantYear) : -1;
render(start >= 0 ? start : ENTRIES.length - 1);
</script>

<script>
setTimeout(()=>{
  if (!window.__ARCHIVE_OK__){
    const s = document.getElementById("status");
    s.className = "status error";
    s.textContent = "Three.js did not load — check the connection to cdn.jsdelivr.net.";
  }
}, 6000);
</script>
